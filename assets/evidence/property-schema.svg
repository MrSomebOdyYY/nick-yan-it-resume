<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 456" width="840" height="456" role="img" aria-labelledby="title desc">
  <title id="title">Property sales database relationships</title>
  <desc id="desc">Buy references Customer, Property and Bill. Sell references Customer and Property. Phone belongs to Customer, Land and House each refer to Property, and Payment belongs to Bill. The primary key of Payment combines the bill and installment number.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #173f35; }
    .table { font-size: 26px; font-weight: 600; }
    .detail { font-size: 17px; }
    .child { font-size: 23px; font-weight: 600; }
    .box { fill: #fafaf4; stroke: #a5bbab; stroke-width: 1.5; }
    .parent { fill: #dbe6d6; stroke: #92ad99; stroke-width: 1.5; }
    .link { fill: none; stroke: #447366; stroke-width: 2.5; }
    .sale { fill: none; stroke: #647050; stroke-width: 2.5; stroke-dasharray: 6 4; }
  </style>
  <rect width="840" height="456" rx="18" fill="#edf2e9"/>
  <g class="link">
    <path d="M182 100 C182 157 128 131 128 191"/>
    <path d="M274 100 C274 161 396 132 396 191"/>
    <path d="M360 100 C360 156 684 124 684 191"/>
    <path d="M140 275 V350 M410 275 C410 314 356 310 356 350 M428 275 C428 314 524 311 524 350 M699 275 V350"/>
  </g>
  <g class="sale"><path d="M515 100 C515 162 159 123 159 191 M624 100 C624 161 442 130 442 191"/></g>
  <g class="box"><rect x="132" y="24" width="260" height="76" rx="9"/><rect x="466" y="24" width="210" height="76" rx="9"/></g>
  <g text-anchor="middle"><text x="262" y="57" class="table">Buy</text><text x="262" y="82" class="detail">buyer · property · bill</text><text x="571" y="57" class="table">Sell</text><text x="571" y="82" class="detail">seller · property</text></g>
  <g class="parent"><rect x="38" y="191" width="204" height="84" rx="9"/><rect x="318" y="191" width="204" height="84" rx="9"/><rect x="598" y="191" width="204" height="84" rx="9"/></g>
  <g text-anchor="middle"><text x="140" y="228" class="table">Customer</text><text x="140" y="253" class="detail">PK: SSN</text><text x="420" y="228" class="table">Property</text><text x="420" y="253" class="detail">PK: PNumber</text><text x="700" y="228" class="table">Bill</text><text x="700" y="253" class="detail">PK: BID</text></g>
  <g class="box"><rect x="53" y="350" width="175" height="78" rx="9"/><rect x="273" y="350" width="155" height="78" rx="9"/><rect x="444" y="350" width="155" height="78" rx="9"/><rect x="616" y="350" width="178" height="78" rx="9"/></g>
  <g text-anchor="middle"><text x="140" y="382" class="child">Phone</text><text x="140" y="407" class="detail">Phone, SSN</text><text x="350" y="382" class="child">Land</text><text x="350" y="407" class="detail">AccessRoad</text><text x="521" y="382" class="child">House</text><text x="521" y="407" class="detail">RoomNum</text><text x="705" y="382" class="child">Payment</text><text x="705" y="407" class="detail">PK: BID, Number</text></g>
</svg>
